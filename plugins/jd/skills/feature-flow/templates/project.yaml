# Project layer for jd:feature-flow. Commands read every project-specific value from here.
# An action with pending: true does not exist yet; the feature that delivers it clears the flag.

project: <name>

language:
  owner:
  docs: en

paths:
  data: project-board/data
  features: project-board/data/features
  tasks: project-board/data/tasks
  owner_actions: project-board/data/owner-actions
  scenarios: project-board/data/scenarios.md
  status: project-board/data/STATUS.md
  design_docs: docs

actions:
  test_all: { run: "<unit test command>", pending: true }
  test_integration: { run: "<integration test command>", pending: true }
  test_scenarios: { run: "<gate scenario suite: active scenarios in suite gate + the given feature's>", pending: true }
  test_scenarios_nightly: { run: "<every scenario, gate and nightly>", pending: true }
  test_scenarios_only: { run: "<run the named scenario tests: {tests}>", pending: true }
  lint: { run: "<lint command>", pending: true }
  gen_check: { run: "<generated code drift check>", pending: true }
  test_bench: { run: "<benchmarks, compared with git.main>", pending: true }
  test_load: { run: "<load test that prints the measured values>", pending: true }
  test_soak_short: { run: "<the soak, shortened to quality.soak_short_hours, same printed values>", pending: true }
  test_soak: { run: "<long-running stability test that prints memory, threads, crashes and stops at the first violation>", pending: true }
  dev_up: { run: "<start dev dependencies>", pending: true }
  dev_seed: { run: "<load sample data>", pending: true }
  dev_run: { run: "<run the app for acceptance>", pending: true }

design_system: DESIGN_SYSTEM.md

audits:
  always: [jd:error-audit, jd:ui-design-audit]
  when_ui: []
  when_schema: [jd:db-audit]

acceptance:
  environment: >-
    <where and how the owner tries features, e.g. this workstation, which emulator or browser>
  forbidden: [production, real payment providers, messages to real users]

quality:
  bench_regression_pct: 10
  gate_suite_minutes: 15
  # When the full-length soak must pass, for every tier: release (default), merge or build.
  long_soak_gate: release
  soak_short_hours: 2
  soak_check_minutes: 60
  # A budget measured above this share of its limit is raised at Gate A.
  headroom_pct: 80
  # A timing budget missed by at most this share is re-measured twice and judged by the median.
  timing_retry_pct: 10

risk:
  # A task touching these paths or topics is high risk.
  high_paths: []
  high_topics: [money, authentication, personal data, uploads, writes to shared or legacy data]

limits:
  fix_attempts: 3
  rework_rounds: 2
  features_active: 1
  features_waiting: 2
  feature_new_scenarios: 8
  feature_tasks: 6

git:
  remote: <host/owner/repo>
  main: main
  integration: pull-request
  branch_pattern: "feat/<ID>-<slug>"
  commit_footer: "Co-Authored-By: <model> <noreply@anthropic.com>"

tasks:
  id_prefix: TASK

board:
  port: 4400

hooks:
  req_check: true
  conventions: true

models:
  large_task: opus
  small_task: sonnet
